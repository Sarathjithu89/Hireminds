services:
  redis:
    image: redis:8.10-alpine
    container_name: hireminds-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: hireminds-server-dev
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_dev_data:
